<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морфологія НМТ</title>
    <style>
        :root { --correct: #2ecc71; --wrong: #e74c3c; --overlay: rgba(255, 255, 255, 0.95); }
        body { margin: 0; padding: 10px; font-family: sans-serif; display: flex; justify-content: center; min-height: 100vh; }
        
        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            /* ТЕСТОВИЙ ФОН */
            background-image: url('https://images.unsplash.com/photo-1629196914058-294c3f15224e?q=80&w=1972&auto=format&fit=crop');
            background-size: cover; background-position: center; background-repeat: no-repeat;
        }

        #quiz-container { background: var(--overlay); max-width: 600px; width: 100%; padding: 20px; margin: 20px auto; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); position: relative; }
        #score { position: sticky; top: 10px; background: #3498db; color: #fff; padding: 10px; text-align: center; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
        .q-block { margin-bottom: 25px; padding: 15px; background: #fff; border-radius: 12px; border: 1px solid #eee; }
        .options { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .opt { padding: 12px; border: 2px solid #f0f0f0; border-radius: 8px; cursor: pointer; transition: 0.2s; background: #fafafa; }
        .opt.correct { background: #d4edda !important; border-color: var(--correct) !important; color: #155724; }
        .opt.wrong { background: #f8d7da !important; border-color: var(--wrong) !important; color: #721c24; }
        .disabled { pointer-events: none; }
        .hint-btn { background: none; border: none; color: #3498db; cursor: pointer; text-decoration: underline; font-size: 0.8rem; margin-top: 10px; }
        .hint-text { display: none; background: #fff9db; padding: 10px; margin-top: 5px; border-radius: 5px; font-size: 0.85rem; }
    </style>
</head>
<body>
<div id="quiz-container">
    <div id="score">Бали: <span id="res">0</span> / 30</div>
    <div id="quiz-body"></div>
</div>
<script>
    const data = [
        { q: "Укажіть рядок, у якому всі слова є іменниками:", a: 2, o: ["сміливий, мужність, синіти", "три, трійка, по-третє", "читання, ходьба, доброта", "високо, висота, високий"], h: "Шукайте питання хто? що?" },
        { q: "Визначте рід іменника «сирота»:", a: 1, o: ["чоловічий", "спільний", "жіночий", "середній"], h: "Він і вона." },
        { q: "Який прикметник не має ступенів порівняння?", a: 3, o: ["холодний", "вузький", "швидкий", "премудрий"], h: "Префікс пре-." },
        { q: "Займенник «нічий» це:", a: 0, o: ["заперечний", "означальний", "неозначений", "питальний"], h: "Ні-." },
        { q: "Правильна форма числівника:", a: 2, o: ["семидесяти", "восьмиста", "п'ятисот", "чотирьохстами"], h: "50-80: перша частина стала." },
        { q: "Дієслово II дієвідміни:", a: 1, o: ["писати", "бачити", "читати", "співати"], h: "БачАТЬ." },
        { q: "Прислівник «по-людськи» пишеться:", a: 3, o: ["разом", "окремо", "з апострофом", "через дефіс"], h: "По- + -и." },
        { q: "Незмінна частина мови:", a: 0, o: ["прислівник", "іменник", "дієслово", "займенник"], h: "Немає закінчення." },
        { q: "Безособове дієслово:", a: 2, o: ["Він спить.", "Діти граються.", "Світає.", "Я працюю."], h: "Стан природи." },
        { q: "«Навколо» у «Навколо школи» це:", a: 1, o: ["прислівник", "прийменник", "частка", "іменник"], h: "При іменнику." },
        { q: "Відмінок «шляхом»:", a: 3, o: ["родовий", "давальний", "місцевий", "орудний"], h: "Чим?" },
        { q: "Помилка у кличному відмінку:", a: 0, o: ["Олегу", "Олеже", "Друже", "Сину"], h: "Олег -> Олеже." },
        { q: "«Залізна воля» це:", a: 2, o: ["відносний", "присвійний", "якісний", "власний"], h: "Переносне значення." },
        { q: "Помилка у правописі:", a: 1, o: ["дещо", "хто зна що", "абихто", "ні з ки"], h: "Хтозна через дефіс." },
        { q: "Час 10:15:", a: 0, o: ["чверть на одинадцяту", "десять п'ятнадцять", "п'ятнадцять після десяти", "чверть одинадцятої"], h: "на + наступна година." },
        { q: "Форма 'засіяне' це:", a: 2, o: ["активний дієприкметник", "прикметник", "пасивний дієприкметник", "дієприслівник"], h: "Над ним зробили дію." },
        { q: "Вид 'прочитавши':", a: 1, o: ["недоконаний", "доконаний", "теперішній", "майбутній"], h: "Що зробивши?" },
        { q: "Слово 'на-гора' пишеться:", a: 3, o: ["окремо", "разом", "з апострофом", "через дефіс"], h: "Виняток." },
        { q: "Похідний прийменник:", a: 0, o: ["Край дороги", "У лісі", "На столі", "До нас"], h: "Край = біля." },
        { q: "Частка сумніву:", a: 2, o: ["тільки", "невже", "навряд чи", "хай"], h: "Може так, може ні." },
        { q: "4-та відміна:", a: 1, o: ["стаття", "теля", "мати", "поле"], h: "Маля тварини." },
        { q: "Тверда група:", a: 3, o: ["синій", "дорожній", "вчорашній", "зелений"], h: "На твердий [н]." },
        { q: "Числівник 'п'ятеро':", a: 0, o: ["збірний", "дробовий", "порядковий", "цілий"], h: "Сукупність." },
        { q: "Сполучник сурядності:", a: 1, o: ["бо", "проте", "якщо", "тому що"], h: "Протиставний." },
        { q: "Вигук:", a: 2, o: ["швидко", "лише", "Ой!", "через"], h: "Емоція." },
        { q: "Наказовий спосіб:", a: 0, o: ["ходімо", "ходитимемо", "йшли б", "пишеш"], h: "Заклик." },
        { q: "Помилка:", a: 3, o: ["три стільці", "чотири вершники", "півтора місяця", "два підручника"], h: "Два підручники." },
        { q: "Дієприкметник:", a: 1, o: ["жовта фарба", "пожовкле листя", "жовтіти", "дуже жовтий"], h: "Ознака за дією." },
        { q: "Вивчити 'на пам'ять':", a: 2, o: ["разом", "дефіс", "окремо", "апостроф"], h: "Окремо." },
        { q: "Спільна ознака дієслів:", a: 0, o: ["вид", "час", "особа", "рід"], h: "Доконаний/недоконаний." }
    ];

    let s = 0;
    const b = document.getElementById('quiz-body');
    const r = document.getElementById('res');

    data.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'q-block';
        div.innerHTML = `<strong>${i+1}. ${item.q}</strong><div class="options">
            ${item.o.map((t, idx) => `<div class="opt" onclick="check(this,${i},${idx},${item.a})">${t}</div>`).join('')}
        </div><button class="hint-btn" onclick="this.nextElementSibling.style.display='block'">Підказка</button>
        <div class="hint-text">${item.h}</div>`;
        b.appendChild(div);
    });

    function check(btn, qI, oI, aI) {
        const opts = btn.parentElement.querySelectorAll('.opt');
        if(oI === aI) { btn.classList.add('correct'); s++; r.innerText = s; }
        else { btn.classList.add('wrong'); opts[aI].classList.add('correct'); }
        opts.forEach(o => o.classList.add('disabled'));
    }
</script>
</body>
</html>
