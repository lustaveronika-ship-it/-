<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морфологія НМТ: Оновлений тест</title>
    <style>
        :root {
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
            --bg-overlay: rgba(255, 255, 255, 0.94);
        }

        body {
            margin: 0;
            padding: 10px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Покращений фон для iPad та телефонів */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: url('https://i.pinimg.com/1200x/e6/4b/6d/e64b6dcae4f4411e400f919dbf1d0bc9.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        #quiz-container {
            background-color: var(--bg-overlay);
            max-width: 600px;
            width: 100%;
            padding: 20px;
            margin: 20px auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            position: relative;
        }

        #score-counter {
            position: sticky;
            top: 10px;
            background: #3498db;
            color: white;
            padding: 12px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 20px;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            font-weight: bold;
        }

        h1 {
            text-align: center;
            font-size: 1.4rem;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        .question-block {
            margin-bottom: 30px;
            padding: 15px;
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e1e8ed;
        }

        .question-text {
            font-weight: 700;
            font-size: 1.05rem;
            margin-bottom: 15px;
            display: block;
            color: #333;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option {
            padding: 12px 15px;
            border: 2px solid #edf2f7;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f8fafc;
            font-size: 0.95rem;
        }

        .option:hover {
            border-color: #3498db;
            background: #f1f5f9;
        }

        .option.correct {
            background-color: #d4edda !important;
            border-color: var(--correct-color) !important;
            color: #155724;
            font-weight: bold;
        }

        .option.wrong {
            background-color: #f8d7da !important;
            border-color: var(--wrong-color) !important;
            color: #721c24;
        }

        .option.disabled {
            pointer-events: none;
        }

        .hint-btn {
            background: none;
            border: none;
            color: #3498db;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 12px;
            padding: 0;
            text-decoration: underline;
        }

        .hint-text {
            display: none;
            font-size: 0.85rem;
            color: #555;
            background: #fff9db;
            padding: 10px;
            margin-top: 8px;
            border-radius: 8px;
            border-left: 4px solid #fadb14;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="score-counter">Результат: <span id="correct-count">0</span> / 30</div>
    <h1>Морфологія: Підготовка до НМТ</h1>
    <div id="quiz-body"></div>
</div>

<script>
    // ПРАВИЛЬНІ ВІДПОВІДІ ТЕПЕР ПЕРЕМІШАНІ (індекс 'a' вказує на правильне місце в 'o')
    const quizData = [
        { q: "Укажіть рядок, у якому всі слова є іменниками:", a: 2, o: ["сміливий, мужність, синіти", "три, трійка, по-третє", "читання, ходьба, доброта", "високо, висота, високий"], h: "Шукайте слова, що відповідають на питання хто? що?" },
        { q: "Визначте рід іменника «сирота»:", a: 1, o: ["чоловічий", "спільний", "жіночий", "середній"], h: "Може позначати і хлопчика, і дівчинку." },
        { q: "Який прикметник не має ступенів порівняння?", a: 3, o: ["холодний", "вузький", "швидкий", "премудрий"], h: "Префікс пре- вже вказує на найвищу міру ознаки." },
        { q: "До якого розряду належить займенник «нічий»?", a: 0, o: ["заперечний", "означальний", "неозначений", "питальний"], h: "Ні- виражає заперечення." },
        { q: "Правильну форму числівника вжито в рядку:", a: 2, o: ["семидесяти", "восьмиста", "п'ятисот", "чотирьохстами"], h: "У назвах десятків перша частина не змінюється." },
        { q: "Укажіть дієслово II дієвідміни:", a: 1, o: ["писати", "бачити", "читати", "співати"], h: "Вони бачАТЬ (виняток)." },
        { q: "Прислівник «по-людськи» пишеться:", a: 3, o: ["разом", "окремо", "з апострофом", "через дефіс"], h: "По- + суфікс -и = дефіс." },
        { q: "Яка частина мови є незмінною?", a: 0, o: ["прислівник", "іменник", "дієслово", "займенник"], h: "Не має закінчення." },
        { q: "Виберіть рядок з безособовим дієсловом:", a: 2, o: ["Він спить.", "Діти граються.", "Світає.", "Я працюю."], h: "Дія без виконавця." },
        { q: "«Навколо» у фразі «Навколо школи» — це:", a: 1, o: ["прислівник", "прийменник", "частка", "іменник"], h: "Вказує на місце біля предмета." },
        { q: "Відмінок іменника «шляхом» (пішли шляхом):", a: 3, o: ["родовий", "давальний", "місцевий", "орудний"], h: "Питання ким? чим?" },
        { q: "Помилка у формі кличного відмінка:", a: 0, o: ["Олегу", "Олеже", "Друже", "Сину"], h: "Має бути чергування Г/Ж." },
        { q: "«Залізна воля» — який це розряд прикметника?", a: 2, o: ["відносний", "присвійний", "якісний", "власний"], h: "Переносне значення робить його якісним." },
        { q: "Знайдіть помилку у правописі займенників:", a: 1, o: ["дещо", "хто зна що", "абихто", "ні з ки"], h: "Хтозна-, казна- пишуться через дефіс." },
        { q: "Правильний запис часу 10:15:", a: 0, o: ["чверть на одинадцяту", "десять п'ятнадцять", "п'ятнадцять після десяти", "чверть одинадцятої"], h: "Прийменник 'на' для першої половини години." },
        { q: "Форма 'засіяне' (поле) — це:", a: 2, o: ["активний дієприкметник", "прикметник", "пасивний дієприкметник", "дієприслівник"], h: "Дія виконана над предметом." },
        { q: "Вид дієприслівника 'прочитавши':", a: 1, o: ["недоконаний", "доконаний", "теперішній", "майбутній"], h: "Що зробивши? (завершена дія)." },
        { q: "Слово 'на-гора' пишеться:", a: 3, o: ["окремо", "разом", "з апострофом", "через дефіс"], h: "Це прислівник-виняток." },
        { q: "Речення з похідним прийменником:", a: 0, o: ["Край дороги росла липа.", "Я пішов у ліс.", "На столі лежить книга.", "До нас прийшли гості."], h: "Край (у значенні біля) утворений від іменника." },
        { q: "Яка частка виражає сумнів?", a: 2, o: ["тільки", "невже", "навряд чи", "хай"], h: "Вказує на невпевненість." },
        { q: "Знайдіть іменник 4-ї відміни:", a: 1, o: ["стаття", "теля", "мати", "поле"], h: "Назви малят на -а/-я." },
        { q: "Прикметник твердої групи:", a: 3, o: ["синій", "дорожній", "вчорашній", "зелений"], h: "Основа на твердий приголосний." },
        { q: "Числівник 'п'ятеро' — це:", a: 0, o: ["збірний", "дробовий", "порядковий", "цілий"], h: "Позначає кількість як сукупність." },
        { q: "Яке слово є сполучником сурядності?", a: 1, o: ["бо", "проте", "якщо", "тому що"], h: "Протиставний сполучник." },
        { q: "Яке слово є вигуком?", a: 2, o: ["швидко", "лише", "Ой!", "через"], h: "Виражає почуття." },
        { q: "Форма наказового способу:", a: 0, o: ["ходімо", "ходитимемо", "йшли б", "пишеш"], h: "Заклик до спільної дії." },
        { q: "Помилка в узгодженні числівника:", a: 3, o: ["три стільці", "чотири вершники", "півтора місяця", "два підручника"], h: "Має бути -и (два підручники)." },
        { q: "Словосполучення з дієприкметником:", a: 1, o: ["жовта фарба", "пожовкле листя", "жовтіти на сонці", "дуже жовтий"], h: "Ознака за дією (яке пожовкло)." },
        { q: "Вивчити 'на пам'ять' пишеться:", a: 2, o: ["разом", "через дефіс", "окремо", "з апострофом"], h: "Сучасна норма для навчального контексту." },
        { q: "Морфологічна ознака, притаманна всім дієсловам:", a: 0, o: ["вид", "час", "особа", "рід"], h: "Навіть інфінітив має вид." }
    ];

    let score = 0;
    const body = document.getElementById('quiz-body');
    const counter = document.getElementById('correct-count');

    quizData.forEach((item, qIdx) => {
        const block = document.createElement('div');
        block.className = 'question-block';
        
        block.innerHTML = `
            <span class="question-text">${qIdx + 1}. ${item.q}</span>
            <div class="options">
                ${item.o.map((text, oIdx) => `
                    <div class="option" onclick="handleSelect(this, ${qIdx}, ${oIdx}, ${item.a})">${text}</div>
                `).join('')}
            </div>
            <button class="hint-btn" onclick="toggleHint(this)">Підказка</button>
            <div class="hint-text">${item.h}</div>
        `;
        body.appendChild(block);
    });

    function toggleHint(btn) {
        const text = btn.nextElementSibling;
        text.style.display = text.style.display === 'block' ? 'none' : 'block';
    }

    function handleSelect(btn, qIdx, oIdx, correctIdx) {
        const options = btn.parentElement.querySelectorAll('.option');
        if (oIdx === correctIdx) {
            btn.classList.add('correct');
            score++;
            counter.innerText = score;
        } else {
            btn.classList.add('wrong');
            options[correctIdx].classList.add('correct');
        }
        options.forEach(opt => opt.classList.add('disabled'));
    }
</script>
</body>
</html>
