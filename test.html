<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морфологія НМТ: Інтерактивний тест</title>
    <style>
        :root {
            --correct-color: #2ecc71;
            --wrong-color: #e74c3c;
            --bg-overlay: rgba(255, 255, 255, 0.92);
        }

        body {
            /* РЯДОК ДЛЯ ФОНУ */
            background-image: url('https://i.pinimg.com/1200x/d8/03/bd/d803bd93b4a8513a804dae575a80b2b5.jpg'); 
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            background-color: #f4f4f9; /* Колір, якщо фон не завантажиться */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        #quiz-container {
            background-color: var(--bg-overlay);
            max-width: 600px;
            width: 100%;
            padding: 20px;
            margin: 10px auto;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .question-block {
            margin-bottom: 25px;
            padding: 15px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #eee;
        }

        .question-text {
            font-weight: 700;
            margin-bottom: 15px;
            display: block;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            font-size: 0.95rem;
        }

        /* Стилі для перевірки */
        .option.correct {
            background-color: #d4edda !important;
            border-color: var(--correct-color) !important;
            color: #155724;
        }

        .option.wrong {
            background-color: #f8d7da !important;
            border-color: var(--wrong-color) !important;
            color: #721c24;
        }

        .option.disabled {
            pointer-events: none;
        }

        .hint-btn {
            background: none;
            border: none;
            color: #3498db;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 10px;
            padding: 0;
            text-decoration: underline;
        }

        .hint-text {
            display: none;
            font-size: 0.85rem;
            color: #666;
            background: #fdf6e3;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
        }

        #score-counter {
            position: sticky;
            top: 0;
            background: #3498db;
            color: white;
            padding: 10px;
            text-align: center;
            border-radius: 0 0 10px 10px;
            margin-bottom: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="score-counter">Правильних відповідей: <span id="correct-count">0</span> / 30</div>
    <h1>Морфологія: Тест НМТ</h1>
    <div id="quiz-body"></div>
</div>

<script>
    const quizData = [
        { q: "Укажіть рядок, у якому всі слова є іменниками:", a: 0, o: ["читання, ходьба, доброта", "сміливий, мужність, синіти", "три, трійка, по-третє", "високо, висота, високий"], h: "Шукайте опредмечені дії (що?)." },
        { q: "Визначте рід іменника «сирота»:", a: 0, o: ["спільний", "чоловічий", "жіночий", "середній"], h: "Може стосуватися обох статей." },
        { q: "Який прикметник не має ступенів порівняння?", a: 0, o: ["премудрий", "холодний", "вузький", "швидкий"], h: "Префікс пре- виключає ступені." },
        { q: "Займенник «нічий» за розрядом:", a: 0, o: ["заперечний", "означальний", "неозначений", "відносний"], h: "Ні- = заперечення." },
        { q: "Правильна форма числівника:", a: 1, o: ["восьмидесяти", "п'ятисот", "сімдесяти", "чотирьохстами"], h: "У десятках перша частина незмінна." },
        { q: "Дієслово II дієвідміни:", a: 0, o: ["бачити", "писати", "чути", "нести"], h: "Вони бачАТЬ." },
        { q: "Як пишеться «по-людськи»?", a: 0, o: ["через дефіс", "разом", "окремо", "з апострофом"], h: "По- + -и = дефіс." },
        { q: "Незмінна частина мови:", a: 0, o: ["прислівник", "іменник", "дієслово", "прикметник"], h: "Не має закінчення." },
        { q: "Безособове дієслово:", a: 0, o: ["Світає.", "Я сплю.", "Йде дощ.", "Квіти цвітуть."], h: "Дія без підмета." },
        { q: "«Навколо» у сполученні «навколо саду» — це:", a: 0, o: ["прийменник", "прислівник", "іменник", "сполучник"], h: "Стоїть при іменнику." },
        { q: "Відмінок слова «шляхом»:", a: 0, o: ["орудний", "місцевий", "давальний", "називний"], h: "Ким? Чим?" },
        { q: "Помилка у кличному відмінку:", a: 0, o: ["Олегу", "Олеже", "Друже", "Козаче"], h: "Г змінюється на Ж." },
        { q: "«Залізна воля» — який розряд?", a: 0, o: ["якісний", "відносний", "присвійний", "власний"], h: "Переносне значення." },
        { q: "Помилка у правописі:", a: 0, o: ["хто-зна-що", "абихто", "ні з ки", "дехто"], h: "Хтозна через дефіс." },
        { q: "Правильний час:", a: 0, o: ["чверть на десяту", "десять п'ятнадцять", "п'ятнадцять по десять", "десять годин п'ятнадцять"], h: "Використовуйте 'на'." },
        { q: "«Зроблений» — це:", a: 0, o: ["пасивний дієприкметник", "активний дієприкметник", "прикметник", "дієприслівник"], h: "Дія над предметом." },
        { q: "Вид «сказавши»:", a: 0, o: ["доконаний", "недоконаний", "минулий", "теперішній"], h: "Що зробивши?" },
        { q: "Слово «на-гора» пишемо:", a: 0, o: ["через дефіс", "разом", "окремо", "з апострофом"], h: "Це виняток." },
        { q: "Похідний прийменник:", a: 0, o: ["протягом", "на", "від", "біля"], h: "Утворений від іменника." },
        { q: "Частка «хай» — це:", a: 0, o: ["формотворча", "заперечна", "питальна", "модальна"], h: "Творить наказовий спосіб." },
        { q: "Іменник 4-ї відміни:", a: 0, o: ["пташеня", "пташка", "птах", "птаство"], h: "Суфікс -ен- при відмінюванні." },
        { q: "Прикметник м'якої групи:", a: 0, o: ["синій", "червоний", "білий", "ясний"], h: "Закінчується на -ій." },
        { q: "Збірний числівник:", a: 0, o: ["семеро", "сім", "сьомий", "сімка"], h: "Суфікс -еро." },
        { q: "Протиставний сполучник:", a: 0, o: ["проте", "і", "бо", "якщо"], h: "Сурядність." },
        { q: "Вигук:", a: 0, o: ["Ой!", "Але", "Тільки", "Над"], h: "Емоція." },
        { q: "Наказовий спосіб:", a: 0, o: ["читай", "читав би", "буду читати", "читаєш"], h: "Заклик до дії." },
        { q: "Помилка:", a: 0, o: ["три підручника", "три підручники", "два вікна", "чотири дні"], h: "Має бути називний множини." },
        { q: "Дієприкметниковий зворот є в реченні:", a: 0, o: ["Квіти, омиті дощем.", "Квіти пахнуть.", "Я бачу квіти.", "Білі квіти."], h: "Ознака за дією + залежні слова." },
        { q: "Пишемо окремо:", a: 0, o: ["на пам'ять (вивчити)", "напам'ять (знати)", "додому", "вказці"], h: "Це прислівникове сполучення." },
        { q: "Дієприслівник відповідає на питання:", a: 0, o: ["що роблячи?", "який?", "що зробити?", "хто?"], h: "Додаткова дія." }
    ];

    let correctScore = 0;
    const body = document.getElementById('quiz-body');
    const counterDisplay = document.getElementById('correct-count');

    quizData.forEach((data, qIndex) => {
        const block = document.createElement('div');
        block.className = 'question-block';
        
        const qText = document.createElement('span');
        qText.className = 'question-text';
        qText.innerText = `${qIndex + 1}. ${data.q}`;
        block.appendChild(qText);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        data.o.forEach((optText, oIndex) => {
            const btn = document.createElement('div');
            btn.className = 'option';
            btn.innerText = optText;
            btn.onclick = () => checkAnswer(btn, qIndex, oIndex, data.a);
            optionsDiv.appendChild(btn);
        });

        block.appendChild(optionsDiv);

        const hBtn = document.createElement('button');
        hBtn.className = 'hint-btn';
        hBtn.innerText = 'Підказка';
        hBtn.onclick = () => {
            const hText = block.querySelector('.hint-text');
            hText.style.display = hText.style.display === 'block' ? 'none' : 'block';
        };
        block.appendChild(hBtn);

        const hText = document.createElement('div');
        hText.className = 'hint-text';
        hText.innerText = data.h;
        block.appendChild(hText);

        body.appendChild(block);
    });

    function checkAnswer(selectedBtn, qIndex, selectedIdx, correctIdx) {
        const parent = selectedBtn.parentElement;
        const options = parent.querySelectorAll('.option');

        if (selectedIdx === correctIdx) {
            selectedBtn.classList.add('correct');
            correctScore++;
            counterDisplay.innerText = correctScore;
        } else {
            selectedBtn.classList.add('wrong');
            options[correctIdx].classList.add('correct');
        }

        options.forEach(opt => opt.classList.add('disabled'));
    }
</script>

</body>
</html>
